[project]
name = "goan-backend"
version = "1.0.0"
description = "GoAn — backend marketplace lái hộ công nghệ (theo SPEC v1.0)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
